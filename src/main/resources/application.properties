spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mototrack}
spring.datasource.username=${DB_USER:mototrack}
spring.datasource.password=${DB_PASSWORD:mototrack123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Plataformas de hospedagem informam a porta em PORT e ficam na frente da API como proxy.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# Limite de requisições por IP nos endpoints sensíveis (login, cadastro, recuperação de senha).
# Atrás de um proxy confiável (Railway, Render...) ligue TRUST_FORWARDED_FOR=true, senão todos
# os usuários parecem vir do mesmo IP.
mototrack.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
mototrack.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

security.jwt.secret=${JWT_SECRET}

# E-mail: por padrão o Mailpit local (docker compose up -d), sem autenticação.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mototrack.mail.from=${MAIL_FROM:MotoTrack <nao-responda@mototrack.local>}
